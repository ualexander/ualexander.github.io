<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Profile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap"
      rel="stylesheet"
      type="text/css"
    />
    <link rel="stylesheet" type="text/css" href="css/styles.css" />
    <script src="js/jquery-4.0.0.js"></script>
    <script src="js/scripts.js"></script>
  </head>

  <body>
    <!-- Shared site header: logo + primary nav, identical on every page -->
    <header>
      <a href="index.html" class="brand">
        <!-- Logo generated by ChatGPT -->
        <img
          src="images/TrailTogether_transparent.png"
          alt="TrailTogether logo"
        />
        <div class="logo">TrailTogether</div>
      </a>

      <!-- Simulated search -->
      <form class="search-form" action="search.html" method="get">
        <input
          type="text"
          name="q"
          aria-label="Search gear"
          placeholder='Try "bear bag"'
        />
        <button type="submit" class="btn btn-secondary">Search</button>
      </form>

      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="trips.html">Trips</a></li>
          <li><a href="gear-library.html">Gear Library</a></li>
          <li><a href="profile.html">Profile</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <h1>Profile</h1>

      <!-- Basic account details -->
      <section aria-labelledby="account-heading">
        <h2 id="account-heading">Account</h2>
        <p><strong>Name:</strong> Alex</p>
        <p><strong>Email:</strong> alex@example.com</p>
      </section>

      <!-- Summary of trip activity -->
      <section aria-labelledby="trips-summary-heading">
        <h2 id="trips-summary-heading">Trip History</h2>
        <p>2 trips planned &middot; 1 upcoming</p>
      </section>
      <button type="button" class="btn btn-secondary">Log Out</button>
    </main>

    <footer>
      <p>&copy; 2026 TrailTogether</p>
    </footer>
  </body>
</html>
