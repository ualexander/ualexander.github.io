<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>All Trips</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap"
      rel="stylesheet"
      type="text/css"
    />
    <link rel="stylesheet" type="text/css" href="css/styles.css" />
    <script src="js/jquery-4.0.0.js"></script>
    <script src="js/scripts.js"></script>
  </head>

  <body>
    <!-- Shared site header: logo + primary nav, identical on every page -->
    <header>
      <a href="index.html" class="brand">
        <!-- Logo generated by ChatGPT -->
        <img
          src="images/TrailTogether_transparent.png"
          alt="TrailTogether logo"
        />
        <div class="logo">TrailTogether</div>
      </a>

      <!-- Simulated search -->
      <form class="search-form" action="search.html" method="get">
        <input
          type="text"
          name="q"
          aria-label="Search gear"
          placeholder='Try "bear bag"'
        />
        <button type="submit" class="btn btn-secondary">Search</button>
      </form>

      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="trips.html">Trips</a></li>
          <li><a href="gear-library.html">Gear Library</a></li>
          <li><a href="profile.html">Profile</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <!-- Page title, sort control, and new trip action -->
      <div class="trips-header">
        <h1>All Trips</h1>

        <div class="trips-header-actions">
          <div class="sort-control">
            <label for="sort-select">Sort by:</label>
            <select id="sort-select" name="sort">
              <option value="date-desc">Date (newest first)</option>
              <option value="date-asc">Date (oldest first)</option>
              <option value="name">Name (A-Z)</option>
            </select>
          </div>
          <a href="add-trip.html" class="btn btn-primary">+ New Trip</a>
        </div>
      </div>

      <!-- Trip cards linking into trip details -->
      <ul class="trip-list">
        <li class="trip-card">
          <a href="trip-details.html">
            <!-- Photo from Unsplash (https://unsplash.com/photos/green-trees-near-lake-and-snow-covered-mountain-during-daytime-8dvphKlzJ40)-->
            <img
              src="images/grand_teton.jpg"
              alt="Grand Teton mountains at sunrise"
            />
            <h2>Grand Teton</h2>
            <p>Nov 2, 2026 &middot; 2 people</p>
          </a>
        </li>
        <li class="trip-card">
          <a href="trip-details.html">
            <!-- Photo from Unsplash (https://unsplash.com/photos/aerial-photography-of-mountain-OOo1c_jJ0Fk)-->
            <img
              src="images/shenandoah.jpg"
              alt="Rolling hills of Shenandoah National Park"
            />
            <h2>Shenandoah</h2>
            <p>Oct 12, 2026 &middot; 4 people</p>
          </a>
        </li>
      </ul>
    </main>

    <footer>
      <p>&copy; 2026 TrailTogether</p>
    </footer>
  </body>
</html>
