<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Gear Library</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap"
      rel="stylesheet"
      type="text/css"
    />
    <link rel="stylesheet" type="text/css" href="css/styles.css" />
    <script src="js/jquery-4.0.0.js"></script>
    <script src="js/scripts.js"></script>
  </head>

  <body>
    <!-- Shared site header: logo + primary nav, identical on every page -->
    <header>
      <a href="index.html" class="brand">
        <!-- Logo generated by ChatGPT -->
        <img
          src="images/TrailTogether_transparent.png"
          alt="TrailTogether logo"
        />
        <div class="logo">TrailTogether</div>
      </a>

      <!-- Simulated search -->
      <form class="search-form" action="search.html" method="get">
        <input
          type="text"
          name="q"
          aria-label="Search gear"
          placeholder='Try "bear bag"'
        />
        <button type="submit" class="btn btn-secondary">Search</button>
      </form>

      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="trips.html">Trips</a></li>
          <li><a href="gear-library.html">Gear Library</a></li>
          <li><a href="profile.html">Profile</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <h1>Gear Library</h1>

      <p>Your saved gear, reusable across trips.</p>

      <!-- All saved gear items -->
      <ul class="gear-list">
        <li class="gear-item"><span>Tent</span></li>
        <li class="gear-item"><span>Sleeping bag</span></li>
        <li class="gear-item"><span>Camp stove</span></li>
        <li class="gear-item"><span>Water filter</span></li>
      </ul>
    </main>

    <footer>
      <p>&copy; 2026 TrailTogether</p>
    </footer>
  </body>
</html>
