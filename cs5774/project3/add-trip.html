<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Add Trip</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap"
      rel="stylesheet"
      type="text/css"
    />
    <link rel="stylesheet" type="text/css" href="css/styles.css" />
    <script src="js/jquery-4.0.0.js"></script>
    <script src="js/scripts.js"></script>
  </head>

  <body>
    <!-- Shared site header: logo + primary nav, identical on every page -->
    <header>
      <a href="index.html" class="brand">
        <!-- Logo generated by ChatGPT -->
        <img
          src="images/TrailTogether_transparent.png"
          alt="TrailTogether logo"
        />
        <div class="logo">TrailTogether</div>
      </a>

      <!-- Simulated search -->
      <form class="search-form" action="search.html" method="get">
        <input
          type="text"
          name="q"
          aria-label="Search gear"
          placeholder='Try "bear bag"'
        />
        <button type="submit" class="btn btn-secondary">Search</button>
      </form>

      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="trips.html">Trips</a></li>
          <li><a href="gear-library.html">Gear Library</a></li>
          <li><a href="profile.html">Profile</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <h1>Add a Trip</h1>

      <!-- New trip form: name, dates, notes, and invited members -->
      <form class="add-trip-form" action="#" method="post">
        <div class="form-field">
          <label for="trip-name">Trip name</label>
          <input type="text" id="trip-name" name="trip-name" required />
          <p class="field-hint">e.g. "Grand Teton" or "Shenandoah loop"</p>
        </div>

        <div class="form-field">
          <label for="trip-start-date">Start date</label>
          <input
            type="date"
            id="trip-start-date"
            name="trip-start-date"
            required
          />
        </div>

        <div class="form-field">
          <label for="trip-end-date">End date</label>
          <input type="date" id="trip-end-date" name="trip-end-date" required />
        </div>

        <div class="form-field">
          <label for="trip-notes">Notes (optional)</label>
          <textarea id="trip-notes" name="trip-notes" rows="4"></textarea>
        </div>

        <div class="form-field">
          <label for="trip-members">Invite members</label>
          <input
            type="text"
            id="trip-members"
            name="trip-members"
            placeholder="Add by email or username"
          />
          <p class="field-hint">Separate multiple people with commas</p>
        </div>

        <button type="button" class="btn btn-secondary btn-full">
          + Start from a previous gear list
        </button>

        <div class="form-actions">
          <a href="trips.html" class="btn btn-secondary">Cancel</a>
          <button type="submit" class="btn btn-primary">Create Trip</button>
        </div>
      </form>
    </main>

    <footer>
      <p>&copy; 2026 TrailTogether</p>
    </footer>
  </body>
</html>
