<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Home</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap"
      rel="stylesheet"
      type="text/css"
    />
    <link rel="stylesheet" type="text/css" href="css/styles.css" />
    <script src="js/jquery-4.0.0.js"></script>
    <script src="js/scripts.js"></script>
  </head>

  <body>
    <!-- Shared site header: logo + primary nav, identical on every page -->
    <header>
      <a href="index.html" class="brand">
        <!-- Logo generated by ChatGPT -->
        <img
          src="images/TrailTogether_transparent.png"
          alt="TrailTogether logo"
        />
        <div class="logo">TrailTogether</div>
      </a>

      <!-- Simulated search -->
      <form class="search-form" action="search.html" method="get">
        <input
          type="text"
          name="q"
          aria-label="Search gear"
          placeholder='Try "bear bag"'
        />
        <button type="submit" class="btn btn-secondary">Search</button>
      </form>

      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="trips.html">Trips</a></li>
          <li><a href="gear-library.html">Gear Library</a></li>
          <li><a href="profile.html">Profile</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <h1>Welcome back</h1>

      <!-- Recent trips: quick links into trip details -->
      <section aria-labelledby="recent-trips-heading">
        <h2 id="recent-trips-heading">Recent Trips</h2>
        <ul class="trip-list">
          <li class="trip-card">
            <a href="trip-details.html">
              <!-- Needs to be updated with js logic later to point to specific trip-->
              <h3>Shenandoah</h3>
              <p>Nov 2, 2026 &middot; 4 people</p>
            </a>
          </li>
          <li class="trip-card">
            <a href="trip-details.html">
              <h3>Grand Teton</h3>
              <p>Oct 12, 2026 &middot; 2 people</p>
            </a>
          </li>
        </ul>
        <a href="add-trip.html" class="btn btn-primary">+ New Trip</a>
      </section>

      <!-- Shortcut into the full gear library -->
      <section aria-labelledby="gear-library-heading">
        <h2 id="gear-library-heading">Gear Library</h2>
        <p><a href="gear-library.html">View your saved gear &rarr;</a></p>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 TrailTogether</p>
    </footer>
  </body>
</html>
